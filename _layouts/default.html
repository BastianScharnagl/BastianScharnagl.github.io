<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <style>
    body {
      font-family: "bs";
      line-height: 1.6;
      color: #333;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      background-color: #fcfcfc;
    }
    header {
      border-bottom: 1px solid #eaeaea;
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }
    nav a {
      margin-right: 1.5rem;
      text-decoration: none;
      color: #555;
      font-weight: 500;
    }
    nav a:hover {
      color: #000;
      border-bottom: 2px solid #000;
    }
    h1, h2, h3 {
      color: #111;
      font-weight: 600;
    }
    a {
      color: #0066cc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    footer {
      margin-top: 4rem;
      border-top: 1px solid #eaeaea;
      padding-top: 1.5rem;
      font-size: 0.9rem;
      color: #777;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      {% for item in site.navigation %}
        <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
      {% endfor %}
    </nav>
  </header>

  <main>
    <h1>{{ page.title }}</h1>
    {{ content }}
  </main>

  <footer>
    <p>&copy; {{ 'now' | date: "%Y" }} | {{ site.title }}</p>
  </footer>

</body>
</html>
